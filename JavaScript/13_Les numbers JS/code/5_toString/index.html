<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JavaScript Convertir Numbers en Strings</title>
</head>
<body>
    <script>
    var x = 10;
    var y = x.toString();
    document.write(y + y);
    document.write(y + "<br>");  // '10'
    document.write(typeof y + "<br>");  // string
    document.write(typeof x + "<br>");  // number
    
    document.write((12).toString() + "<br>");  // '12'
    document.write((15.6).toString() + "<br>");  // '15.6'
    document.write((6).toString() + "<br>");  // '6'
    </script>
</body>
</html>
