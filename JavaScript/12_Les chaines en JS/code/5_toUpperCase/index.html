<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript Convertir une chaîne en caractères majuscules</title>
</head>
<body>
    <script>
        //toUpperCase
    let str = "hello world!";
    let result = str.toUpperCase();
    document.write(result + "<br> <hr>"); // Prints: HELLO WORLD!
        
    //toLowerCase
    str = "HELLO WORLD!";
    result = str.toLowerCase();
    document.write(result); 
    </script>   
</body>
</html>
