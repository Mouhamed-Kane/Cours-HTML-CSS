<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript Découpe d'une partie d'une chaîne de caractère</title>
</head>
<body>
    <script>
    let str = "Le renard brun et rapide saute par-dessus le chien paresseux.";
    let subStr = str.slice(3, 15);
    document.write(subStr); // Prints: renard brun
    </script>
</body>
</html>
