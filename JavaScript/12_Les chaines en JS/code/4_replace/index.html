<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript Remplacer une partie d'une chaîne par une autre chaîne</title>
</head>
<body>
    <script>
    let str = "La couleur rouge est plus lumineuse que la couleur bleue.";
    let result = str.replace("rouge", "noir");
    document.write(result); // 0utputs: La couleur noir est plus lumineuse que la couleur bleue
    </script>
</body>
</html>
