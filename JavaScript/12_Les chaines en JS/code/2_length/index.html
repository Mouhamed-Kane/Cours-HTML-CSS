<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Longueur d'une chaine</title>
</head>
<body>
    <script>
    let str1 = "Ceci est un paragraphe de texte.";
    document.write(str1.length + "<br>"); // Prints 32

    document.write(str2.length); // Prints 35
