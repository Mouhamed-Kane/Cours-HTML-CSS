<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Timing</h2>

<p>Cliquez sur "Essayer". Attendez 3 secondes. 
  La page affichera "Bonjour".</p>
<p>(Vous devez cliquer sur "Arrêter" avant que les 3 secondes 
  ne soient écoulées.)</p>

<button onclick="myVar = setTimeout(myFunction, 3000)">Essayer</button>

<button onclick="clearTimeout(myVar)">Arrêter</button>

<script>
function myFunction() {
  alert("Bonjour");
}
</script>
</body>
</html>
