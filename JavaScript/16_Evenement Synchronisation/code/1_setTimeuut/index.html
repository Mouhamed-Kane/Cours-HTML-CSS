<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Timing</h2>

<p>Cliquez sur "Essayer". Attendez 3 secondes, 
  et la page affichera "Hello World !".</p>

<button onclick="setTimeout(myFunction, 2000);">Essayer</button>

<script>
function myFunction() {
  alert('Hello World !');
}
</script>

</body>
</html>
