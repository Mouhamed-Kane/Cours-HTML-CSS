<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript Time Strings</title>
</head>
<body>
    <script>
    const d = new Date();
    document.write(d.toTimeString() + "<br>"); // Afficher la partie horaire de la date 
    document.write(d.toLocaleTimeString()); // Afficher une chaîne de temps localisée
    </script>
</body>
</html>
