<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JavaScript obtenir année, mois, et jour </title>
</head>
<body>
    <script>
    const d = new Date();
    // Extracting date part
    document.write(d.getDate() + "<br>"); // Afficher le jour du mois 
    document.write(d.getDay() + "<br>"); // Afficher le nombre de jours de la semaine (0-6) 
    document.write(d.getMonth() + "<br>"); // Afficher le nombre de mois de l'année (0-11) 
    document.write(d.getFullYear()); // Afficher l'année complète (quatre chiffres)
    </script>
    
</body>
</html>
