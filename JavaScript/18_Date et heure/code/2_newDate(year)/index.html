<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript passer des paramétre à l'objet Date</title>
</head>
<body>
    <script>
        /* JavaScript compte les mois de 0 à 11 :
        janvier = 0 .
        décembre = 11*/ 
    let d = new Date(2025,8,24,10,50,20);
    document.write(d);
    </script>
</body>
</html>
