<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript Boucle While</title>
</head>
<body>
    <script>
    let i = 1;
    while(i <= 5) {    
        document.write("<p>Le nombre est: " + i + "</p>");
        i++;
    }
    document.write('Fin de la boucle');
    </script>
</body>
</html>
