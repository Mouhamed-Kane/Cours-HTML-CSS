<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Boucle JavaScript dans un tableau à l'aide de la boucle For-In</title>
</head>
<body>
    <script>
    // Un tableau avec quelques éléments
    let fruits =["Pomme", "Banana", "Mangue", "Papaye"];
    // Parcourez en boucle tous les éléments du tableau 
    for(let i in fruits) {  
        document.write("<p>" + fruits[i] + "</p>");
    }
    </script>
</body>
</html>
