<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JavaScript parcourir un tableau avec la boucle for</title>
</head>
<body>
    <script>
    // // Un tableau avec quelques éléments
    let fruits = ["Pomme", "Banana", "Mangue", "Orange", "Papaye"];
    // Boucle sur tous les éléments du tableau 
    for(let i=0; i<fruits.length; i++) {    
        document.write("<p>" + i + " = " + fruits[i] + "</p>");
    }
    </script>
</body>
</html>
