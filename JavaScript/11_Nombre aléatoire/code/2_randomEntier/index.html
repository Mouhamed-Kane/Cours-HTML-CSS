<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript Math</h2>

    <p>
      Math.floor(Math.random() * 10) renvoie un entier aléatoire entre 0 et 9
      (les deux inclus) :
    </p>

    <p id="demo"></p>

    <script>
      document.getElementById("demo").innerHTML = Math.floor(
        Math.random() * 10
      );
    </script>
  </body>
</html>
