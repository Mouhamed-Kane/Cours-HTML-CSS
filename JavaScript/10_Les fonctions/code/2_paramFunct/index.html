<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript ajout de paramétre aux fonctions</title>
</head>
<body>
    <script>
    // Defining function
    function displaySum(num1, num2) {
        let total = num1 + num2 ;
        document.write(total);
    }
     
    // Calling function
    displaySum(6, 20); // Prints: 26
    document.write("<br>");
    displaySum(-5, 17); // Prints: 12
    
    </script>
</body>
</html>
