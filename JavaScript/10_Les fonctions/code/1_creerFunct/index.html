<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Définir et appeler une fonction JS</title>
</head>
<body>
    <script>
    // Définir la fonction
    function sayHello() {
        document.write("Hello, bienvenue dans mon site !");
    }
     
    // Appel de la fonction
    sayHello(); // Prints: Hello, bienvenue dans mon site !
    </script>
</body>
</html>
