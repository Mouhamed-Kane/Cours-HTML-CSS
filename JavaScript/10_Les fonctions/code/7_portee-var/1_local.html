<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript Variable Locale</title>
</head>
<body>
    <script>
        
    // Defining function
    function greetWorld() {
        let greet = "Hello World!";
        document.write(greet);
    }
     
    greetWorld(); // Prints: Hello World!
    
    
    document.write(greet); // Uncaught ReferenceError: greet is not defined
    </script>
</body>
</html>
