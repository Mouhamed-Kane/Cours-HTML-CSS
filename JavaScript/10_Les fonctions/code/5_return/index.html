<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript retourner la valeur d'une</title>
</head>
<body>
    <script>
    // Defining function
    function getSum(num1, num2) {
        let total = num1 + num2;
        return total;
    }
     
    // Displaying returned value
    document.write(getSum(6, 20) + "<br>"); // Prints: 26
    document.write(getSum(-5, 17)); // Prints: 12
    </script>
</body>
</html>
