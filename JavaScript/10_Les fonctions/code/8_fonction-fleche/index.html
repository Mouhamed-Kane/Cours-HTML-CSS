<!DOCTYPE html>
<html>
<body>

<p>Avec les fonctions flèches, vous n'avez pas besoin de taper le mot-clé de fonction, le mot-clé de retour et les accolades.</p>

<p>Les fonctions de flèches ne sont pas prises en charge par IE11 ou les versions antérieures.</p>

<p id="demo"></p>

<script>
const x = (x, y) => x * y;
document.getElementById("demo").innerHTML = x(5, 5);

</script>

</body>
</html>
