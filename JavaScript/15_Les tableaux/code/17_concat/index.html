<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript Merge Two Arrays</title>
</head>
<body>
    <script>
    const pets = ["Chat", "Chien", "Perroquet"];
    const wilds = ["Tigre", "Loup", "Eléphant"];
    
    // Creating new array by combining pets and wilds arrays
    const animals = pets.concat(wilds); 
    document.write(animals); // Prints: Chat,Chien,Perroquet,Tigre,Loup,Eléphant
    
    </script>
</body>
</html>
