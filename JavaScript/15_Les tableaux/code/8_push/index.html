<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript ajout d'un new element à la fin du tableau</title>
</head>
<body>
    <script>
    let colors = ["Red", "Green", "Blue"]; 
    document.write(colors + "<br>");
    colors.push("Yellow");
     
    document.write(colors + "<br>"); // Prints: Red,Green,Blue,Yellow
    document.write(colors.length); // Prints: 4
    </script>
</body>
</html>
