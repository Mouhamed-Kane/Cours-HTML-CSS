<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript boucle For</title>
</head>
<body>
    <script>
    let fruits = ["Apple", "Banana", "Mango", "Orange", "Papaya"];
 
    // Iterates over array elements
    for(let i = 0; i < fruits.length; i++){    
        document.write(i + " " + fruits[i] + "<br>"); // Print array element
    }
    </script>
</body>
</html>
