<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript supprimer le dernier élément</title>
</head>
<body>
    <script>
    let colors = ["Red", "Green", "Blue"];
    document.write(colors + "<br>");
    let last = colors.pop();
   
     
    document.write(last + "<br>"); // Prints: Blue
    document.write(colors.length); // Prints: 2
    </script>
</body>
</html>
