<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript boucle For-Of </title>
</head>
<body>
    <script>
    let fruits = ["Apple", "Banana", "Mango", "Orange", "Papaya"];
 
    // Iterates over array elements
    for(let fruit of fruits){    
        document.write(fruit + "<br>"); // Print array element
    }
    </script>
</body>
</html>
