
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript boucle For-In </title>
</head>
<body>
    <script>
    let fruits = ["Apple", "Banana", "Mango", "Orange", "Papaya"];
 
    // Loop through all the elements in the array 
    for(let i in fruits)  {  
        document.write(fruits[i] + "<br>");
    }
    </script>
</body>
</html>
