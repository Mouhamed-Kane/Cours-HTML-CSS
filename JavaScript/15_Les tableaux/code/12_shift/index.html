<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript le premier element du tableau</title>
</head>
<body>
    <script>
    let colors = ["Red", "Green", "Blue"];
    let first = colors.shift();
     
    document.write(first + "<br>"); // Prints: Red
    document.write(colors.length); // Prints: 2
    </script>
</body>
</html>
