<!DOCTYPE html>
<html>
<body>

<h2>JavaScript if .. else</h2>

<p id="demo"></p>

<script>

  let note1 = prompt("Entrer votre note 1");
  note1 = parseInt(note1);
  
  let note2 = prompt("Entrer votre note 2");
  note2 = parseInt(note2);
  
  let moyenne = (note1 + note2) / 2;
  
  if( moyenne >= 10) {
    document.getElementById("demo").innerHTML = moyenne + 
    " Félicatations, vous avez la moyenne";
  } else {
    document.getElementById("demo").innerHTML = moyenne + 
    " Désolé, vous n'avez pas la moyenne";
  }

  // opérateur ternaire
  // (moyenne >=10) ? console.log('Félicitation') : console.log('Vous n\'avez pas la moyenne');
  </script>

</body>
</html>
