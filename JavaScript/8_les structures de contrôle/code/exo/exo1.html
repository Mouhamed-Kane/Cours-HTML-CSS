<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Ecrire un programme qui demande un nombre à l'utilisateur (1 et 7)
    Affiche le jour de la semaine correspondant à ce nombre (if - else if - else) -->

    <script>
        //demande un nombre à l'utilisateur (1 et 7)
        let nombre = parseInt(prompt('Saisir un nombre compris entre 1 et 7'));

        if (nombre == 1){
            alert("On est Lundi");
        } else if (nombre == 2) {
            alert ("On est mardi");
        }
        else if (nombre == 3) {
            alert ("On est mercredi");
        }
        else if (nombre == 4) {
            alert ("On est jeudi");
        }
        else if (nombre == 5) {
            alert ("On est vendredi");
        }
        else if (nombre == 6) {
            alert ("On est samedi");
        } else if (nombre == 7) {
            alert ("On est dimanche");
        } else {
            alert("N'est pas un jour de la semaine")
        }

        // Affiche le jour de la semaine correspondant
    </script>
</body>
</html>
