<!DOCTYPE html>
<html>
<body>

<h2>JavaScript HTML DOM</h2>
<img id="image" src="smiley.gif" width="160" height="120">

<script>
document.getElementById("image").src = "landscape.jpg";
</script>

<p>L'image d'origine était smiley.gif, 
    mais le script l'a changée en landscape.jpg</p>

</body>
</html>
