<!DOCTYPE html>
<html>
<body>

<h2>JavaScript addEventListener()</h2>
<p>Cet exemple utilise la méthode addEventListener() 
  pour ajouter plusieurs événements sur le même bouton..</p>

<button id="myBtn">Essayer</button>

<p id="demo"></p>

<script>
var x = document.getElementById("myBtn");
x.addEventListener("mouseover", myFunction);
x.addEventListener("click", mySecondFunction);
x.addEventListener("mouseout", myThirdFunction);

function myFunction() {
  document.getElementById("demo").innerHTML += "Passé la souris!<br>";
}

function mySecondFunction() {
  document.getElementById("demo").innerHTML += "Clique!<br>";
}

function myThirdFunction() {
  document.getElementById("demo").innerHTML += "Retiré la souris!<br>";
}
</script>

</body>
</html>
