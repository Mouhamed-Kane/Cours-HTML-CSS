<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript traitant l'événement Mouseout</title>
</head>
<body>
    <button type="button" onmouseout="alert('Vous avez quitté le bouton!');">Placez la souris à l'intérieur de moi et sortez</button>
    <a href="#" onmouseout="alert('Vous avez quitté le lien!');">Placez la souris à l'intérieur de moi et sortez</a>
</body>
</html>
