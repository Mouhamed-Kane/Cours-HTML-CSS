<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript traitant l'événement Keyu</title>
</head>
<body>
    <input type="text" onkeyup="alert('Vous avez libéré une touche dans une entrée de text!')">
    <hr>
    <textarea cols="30" onkeyup="alert('Vous avez libéré une touche dans une zone de text!')"></textarea>
	<p><strong>Note:</strong> Essayez d'entrer du texte dans la zone de saisie et dans la zone de texte.</p>
</body>
</html>
