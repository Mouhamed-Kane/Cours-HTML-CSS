<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript traitant l'événement de soumission</title>
</head>
<body>
    <form method="post" onsubmit="confirm('Vous êtes sur d\'envoyer les données ?');">
        <label>Prénom:</label>
        <input type="text" name="first-name" required>
        <input type="submit" value="Envoyer">
    </form>
</body>
</html>
