<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Traitement de l'événement Focus par JavaScript</title>
</head>
<body>
    <script>
        function champInput(elm){
            elm.style.background = "yellow";
        }    
    </script>
    <input type="text" onfocus="champInput(this)">
    <button type="button">Button</button>
</body>
</html>
