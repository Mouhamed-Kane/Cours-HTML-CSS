<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript traitant l'événement Mouseover</title>
</head>
<body>
    <button type="button" onmouseover="alert('Vous avez placé le pointeur de la souris sur un bouton!');">Placez la souris sur moi</button>
    <a href="#" onmouseover="alert('Vous avez placé le pointeur de la souris sur un lien!');">Placez la souris au-dessus de moi</a>
</body>
</html>
