<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript traitant l'événement Keydown</title>
</head>
<body>
    <input type="text" onkeydown=
    "alert('Vous avez appuyé sur une touche dans la saisie de texte!')">
    <hr>
    <textarea cols="30" onkeydown=
    "alert('Vous avez appuyé sur une touche dans une zone de texte!')"></textarea>
	<p><strong>Note:</strong> Essayez d'entrer du texte dans la zone de 
        saisie et dans la zone de texte..</p>
</body>
</html>
