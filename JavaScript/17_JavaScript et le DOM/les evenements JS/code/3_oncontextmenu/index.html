<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>JavaScript traitant l'événement Contextmenu</title>
</head>
<body>
    <button type="button" oncontextmenu="alert('Vous avez fait un clic droit sur un bouton!');">Fait un click droit</button>
    <a href="#" oncontextmenu="alert('Vous avez fait un clic droit sur un lien!');">Fait un click droit</a>
</body>
</html>
