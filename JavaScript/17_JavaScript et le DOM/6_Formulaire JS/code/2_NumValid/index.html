<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Validation</h2>
<p>Entrer un nombre entre 1 et 10:</p>
<input id="numb">
<button type="button" onclick="myFunction()">Envoyer</button>
<p id="demo"></p>
<script>
function myFunction() {
  // Obtenez la valeur du champ de saisie avec id="numb".
  let x = document.getElementById("numb").value;
  // Si x n'est pas un nombre ou est inférieur à un ou supérieur à 10
  let text;
  if (isNaN(x) || x < 1 || x > 10) {
    text = "Entrée non valide";
  } else {
    text = "Entrée OK";
  }
  document.getElementById("demo").innerHTML = text;
}
</script>

</body>
</html>
