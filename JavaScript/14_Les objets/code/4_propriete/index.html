<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Objects</h2>

<p>Il y a deux façons différentes d'accéder à la propriété d'un objet.</p>

<p>Vous pouvez utiliser person.property ou person["property"].</p>

<p id="demo"></p>

<script>
// Create an object:
const person = {
  firstName: "John",
  lastName : "Doe",
  id     :  5566
};

// Display some data from the object:
document.getElementById("demo").innerHTML =
person.firstName + " " + person.lastName;
</script>

</body>
</html>
