<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Objects</h2>
<p>Une méthode d'objet est une définition de fonction, stockée comme une valeur de propriété.</p>

<p id="demo"></p>

<script>
// Create an object:
const person = {
  firstName: "John",
  lastName: "Doe",
  id: 5566,
  fullName: function() {
    return this.firstName + " " + this.lastName;
  }
};

// Display data from the object:
document.getElementById("demo").innerHTML = person.fullName();
</script>

</body>
</html>
