<!DOCTYPE html>
<html>
<body>

    <h2>JavaScript Objects</h2>

    <p id="demo"></p>

    <script>
        // Create an object:
        const person = { 
            firstName: "John", 
            lastName: "Doe", 
            age: 50, 
            eyeColor: "blue",
            animal : "Chien"
        };

        // Display some data from the object:
        document.getElementById("demo").innerHTML =
            person.firstName + " a " + person.age + " ans."
            + " La couleur de ses yeux est : " + person.eyeColor;
    </script>

</body>

</html>
