<!DOCTYPE html>
<html>
<body>


<p>L'opérateur OR (||) renvoie un résultat vrai si l'une ou les deux expressions sont vraies, sinon il renvoie un résultat faux.</p>

<p id="demo"></p>

<script>
let x = 6;
let y = 3;

document.getElementById("demo").innerHTML = 
(x == 5 || y == 5) + "<br>" +  
(x == 6 || y == 0) + "<br>" + 
(x == 0 || y == 3) + "<br>" + 
(x == 6 || y == 3);
</script>

</body>
</html>
