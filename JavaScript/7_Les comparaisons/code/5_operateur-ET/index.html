<!DOCTYPE html>
<html>
<body>
<p>L'opérateur AND ou ET en français (&&) renvoie un résultat vrai si les deux expressions sont vraies, sinon il renvoie un résultat faux.</p>

<p id="demo"></p>

<script>
let x = 6;
let y = 3;
document.getElementById("demo").innerHTML = 
(x < 10 && y > 1) + "<br>" +  //true
(x < 10 && y < 1); //False
</script>

</body>
</html>
