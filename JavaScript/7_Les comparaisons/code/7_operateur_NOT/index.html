<!DOCTYPE html>
<html>
<body>


<p>L'opérateur NOT (!) renvoie un résultat vrai pour les déclarations fausses et faux pour les déclarations vraies.</p>

<p id="demo"></p>

<script>
let x = 6;
let y = 3;

document.getElementById("demo").innerHTML = 
!(x === y) + "<br>" + 
!(x > y);
</script>

</body>
</html>
